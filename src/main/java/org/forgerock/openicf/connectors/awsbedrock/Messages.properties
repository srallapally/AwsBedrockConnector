## This file maps annotated display keys (from @ConnectorClass, @ConfigurationProperty, etc.)

# -------------------------------------------------------------------
# Connector display name
# -------------------------------------------------------------------
awsbedrock.connector.display=AWS Bedrock Connector

# -------------------------------------------------------------------
# Configuration properties
# -------------------------------------------------------------------

# Region
awsbedrock.region.display=AWS Region
awsbedrock.region.help=AWS region where Bedrock Agents are deployed (e.g., us-east-1, us-west-2).

# Default credentials provider toggle
awsbedrock.useDefaultCredentials.display=Use Default AWS Credentials Provider
awsbedrock.useDefaultCredentials.help=If enabled, the connector uses the AWS SDK DefaultCredentialsProvider chain (environment variables, shared config, EC2/ECS role).

# Access Key ID (only when not using default credentials)
awsbedrock.accessKeyId.display=Access Key ID
awsbedrock.accessKeyId.help=AWS access key ID used to authenticate when the default credentials provider is disabled.

# Secret Access Key (only when not using default credentials)
awsbedrock.secretAccessKey.display=Secret Access Key
awsbedrock.secretAccessKey.help=AWS secret access key used to authenticate when the default credentials provider is disabled.

