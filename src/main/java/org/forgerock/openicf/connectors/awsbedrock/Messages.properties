## This file maps annotated display keys (from @ConnectorClass, @ConfigurationProperty, etc.)

# -------------------------------------------------------------------
# Connector display name
# -------------------------------------------------------------------
awsbedrock.connector.display=AWS Bedrock Connector

# -------------------------------------------------------------------
# Configuration properties
# -------------------------------------------------------------------

# Region
awsbedrock.region.display=AWS Region
awsbedrock.region.help=AWS region where Bedrock Agents are deployed (e.g., us-east-1, us-west-2).

# Default credentials provider toggle
awsbedrock.useDefaultCredentials.display=Use Default AWS Credentials Provider
awsbedrock.useDefaultCredentials.help=If enabled, the connector uses the AWS SDK DefaultCredentialsProvider chain (environment variables, shared config, EC2/ECS role).

# Access Key ID (only when not using default credentials)
awsbedrock.accessKeyId.display=Access Key ID
awsbedrock.accessKeyId.help=AWS access key ID used to authenticate when the default credentials provider is disabled.

# Secret Access Key (only when not using default credentials)
awsbedrock.secretAccessKey.display=Secret Access Key
awsbedrock.secretAccessKey.help=AWS secret access key used to authenticate when the default credentials provider is disabled.

# -------------------------------------------------------------------
# OPENICF-425: Display/help keys for new account attributes
# -------------------------------------------------------------------

# Account ID
awsbedrock.accountId.display=AWS Account ID
awsbedrock.accountId.help=AWS account ID (e.g., 123456789012) used to resolve Bedrock agent ARNs and IAM relationships.

# Alias attributes
awsbedrock.aliasId.display=Alias ID
awsbedrock.aliasId.help=The unique identifier of the Bedrock agent alias.

awsbedrock.aliasName.display=Alias Name
awsbedrock.aliasName.help=The friendly name of the Bedrock agent alias.

awsbedrock.agentAliasStatus.display=Alias Status
awsbedrock.agentAliasStatus.help=The current status of the agent alias (e.g., CREATING, PREPARED, FAILED, DELETING).

# Region per-object
awsbedrock.region.attr.display=Region
awsbedrock.region.attr.help=AWS region where this agent or alias is deployed.

# Multi-agent collaboration
awsbedrock.agentCollaboration.display=Agent Collaboration
awsbedrock.agentCollaboration.help=The agent's collaboration mode setting (e.g., SUPERVISOR, SUPERVISOR_ROUTER, DISABLED).

awsbedrock.connectedAgents.display=Connected Agents
awsbedrock.connectedAgents.help=List of collaborator agent alias ARNs associated with this agent.
# -------------------------------------------------------------------
# Property grouping
# -------------------------------------------------------------------
basic.group=Basic Configuration Properties
